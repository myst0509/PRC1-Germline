name: prc1-germline
channels:
  - conda-forge
  - bioconda
dependencies:
  - python=3.11
  - snakemake>=8
  - entrez-direct          # esearch/efetch: resolve GSE -> SRA runs
  - sra-tools              # prefetch, fasterq-dump
  - fastqc
  - fastp
  - bowtie2
  - macs2
  - star
  - subread                # featureCounts
  - samtools
  - bedtools
  - deeptools
  - pandas
  - numpy
  - matplotlib
  - seaborn
  - scikit-learn
  - pyranges               # fast interval overlap in pure python
  - pip
  - pip:
    - pydeseq2             # DESeq2 in python, no R required
    - gseapy               # GO / pathway enrichment
    - jupyter
